<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>Видео-плеер с кнопками</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #0b0e14;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem 1rem;
        }

        .container {
            max-width: 820px;
            width: 100%;
            background: #181e26;
            border-radius: 2rem;
            padding: 1.8rem 1.5rem 2.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            transition: 0.2s;
        }

        h1 {
            color: #f0f3f8;
            font-weight: 500;
            font-size: 1.8rem;
            letter-spacing: -0.5px;
            margin-bottom: 0.3rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        h1 small {
            font-size: 1rem;
            font-weight: 400;
            color: #8895aa;
            margin-left: auto;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #0f131a;
            border-radius: 1.2rem;
            overflow: hidden;
            box-shadow: inset 0 0 0 1px #2a3340;
            margin: 1.2rem 0 1.8rem;
        }

        .video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Панель кнопок — адаптивная сетка */
        .button-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 0.7rem;
            margin-top: 0.5rem;
            justify-content: flex-start;
        }

        .video-btn {
            background: #252f3d;
            border: none;
            border-radius: 3rem;
            padding: 0.3rem 0.4rem;
            font-size: 1rem;
            font-weight: 500;
            color: #d6e0ed;
            cursor: pointer;
            transition: 0.2s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            flex: 0 1 auto;
            min-width: 80px;
            justify-content: center;
            border: 1px solid #3c485a;
        }

        .video-btn:hover {
            background: #344157;
            transform: scale(1.02);
            border-color: #5d6f88;
        }

        .video-btn:active {
            transform: scale(0.96);
        }

        .video-btn.active {
            background: #3d8cff;
            border-color: #7bb0ff;
            color: white;
            box-shadow: 0 0 16px #3d8cff66;
        }

        .video-btn .badge {
            background: #1e2632;
            padding: 0.1rem 0.6rem;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #b0c2db;
        }

        .video-btn.active .badge {
            background: #2a5bb5;
            color: #e0edff;
        }

        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #a5b8d0;
            font-size: 0.9rem;
            margin: 0.5rem 0 0.2rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .info-bar span {
            background: #1f2835;
            padding: 0.25rem 1rem;
            border-radius: 30px;
            border: 1px solid #2d3848;
        }

        .empty-state {
            color: #6a7c94;
            text-align: center;
            padding: 1.8rem 0.5rem;
            font-size: 1rem;
            background: #141b24;
            border-radius: 2rem;
            margin: 0.5rem 0;
        }

        /* инструкция по вставке */
        .howto {
            background: #111922;
            border-radius: 1.2rem;
            padding: 1rem 1.4rem;
            margin-top: 1.8rem;
            border-left: 4px solid #3d8cff;
            color: #b8cbdf;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .howto code {
            background: #1f2a37;
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            color: #d6eaff;
            font-size: 0.85rem;
            word-break: break-all;
        }

        /* мобильная адаптация */
        @media (max-width: 600px) {
            body { padding: 0.8rem; }
            .container { padding: 1rem 0.8rem 1.8rem; }
            h1 { font-size: 1.4rem; flex-wrap: wrap; }
            h1 small { font-size: 0.8rem; margin-left: 0; }
            .video-btn {
                padding: 0.5rem 1.2rem;
                font-size: 0.9rem;
                min-width: 60px;
                flex: 1 0 auto;
                max-width: 100%;
            }
            .button-panel {
                gap: 0.5rem;
                justify-content: center;
            }
            .info-bar {
                flex-direction: column;
                align-items: flex-start;
            }
            .howto code {
                font-size: 0.75rem;
                word-break: break-word;
            }
        }

        @media (max-width: 420px) {
            .video-btn {
                padding: 0.5rem 0.8rem;
                font-size: 0.8rem;
                min-width: 50px;
            }
        }
    </style>
</head>
<body>
<div class="container" id="appContainer">
    <h1>
        🎬 Видео-центр
        <small id="videoCounter">0</small>
    </h1>

    <!-- Окно плеера -->
    <div class="video-wrapper" id="videoWrapper">
        <iframe id="mainPlayer" 
            width="720" height="405" 
            src="https://rutube.ru/play/embed/dc8cd13a5c5f804b18099f78bee9f05b/" 
            style="border: none;" 
            allow="clipboard-write; autoplay" 
            allowfullscreen>
        </iframe>
    </div>

    <!-- Информационная строка -->
    <div class="info-bar">
        <span id="currentVideoLabel">▶️ Видео 1</span>
        <span id="totalVideosLabel">📹 Всего: 1</span>
    </div>

    <!-- Кнопки для видео -->
    <div class="button-panel" id="buttonPanel">
        <!-- Кнопки будут сгенерированы скриптом -->
    </div>

</div>

<script>
    (function() {
        // ------------------------------------------------------------
        // 1. СПИСОК ВИДЕО (добавляйте новые iframe сюда)
        //    title — подпись на кнопке (можно коротко)
        // ------------------------------------------------------------
        const videoList = [
            {
                src: "https://rutube.ru/play/embed/dc8cd13a5c5f804b18099f78bee9f05b/",
                title: "Видео 1"
            },
            {
                src: "https://rutube.ru/play/embed/d2bbed64c93a2848e78eafa4eaf08180/",
                title: "Видео 2"
            },
            {
                src: "https://rutube.ru/play/embed/42ca390583205a7d435bae3081a38387/",
                title: "Видео 3"
            },
            {
                src: "https://rutube.ru/play/embed/c9213c959e17d042783b5c8f898e952f/",
                title: "Видео 4"
            },
            {
                src: "https://rutube.ru/play/embed/dfd4d1d3be2c81b0ae254ce6e9afc890/",
                title: "Видео 5"
            },
            {
                src: "https://rutube.ru/play/embed/6a05eadd328b924264fda2678e57db2d/",
                title: "Видео 6"
            },
            {
                src: "https://rutube.ru/play/embed/65f747549f434d1a693c54b942626457/",
                title: "Видео 7"
            },
            {
                src: "https://rutube.ru/play/embed/9ea7bee3ef2a604324a2564f55487173/",
                title: "Видео 8"
            },
            {
                src: "https://rutube.ru/play/embed/541419756f7baa62960347758bd0d303/",
                title: "Видео 9"
            },
            {
                src: "https://rutube.ru/play/embed/894ecbe90af3ce863ee5476e42bf32d1/",
                title: "Видео 10"
            },
            {
                src: "https://rutube.ru/play/embed/0424818c6407311feb3900e63621f6a8/",
                title: "Видео 11"
            },
            {
                src: "https://rutube.ru/play/embed/dec9eae544ed3de59756542022304361/",
                title: "Видео 12"
            },
            // Раскомментируйте и добавьте свои видео:
            // {
            //     src: "https://rutube.ru/play/embed/ВАШ_КОД/",
            //     title: "Видео 2"
            // },
            // {
            //     src: "https://rutube.ru/play/embed/ЕЩЕ_ОДИН/",
            //     title: "Видео 3"
            // }
			

        ];

        // ------------------------------------------------------------
        // 2. Элементы DOM
        // ------------------------------------------------------------
        const playerIframe = document.getElementById('mainPlayer');
        const buttonPanel = document.getElementById('buttonPanel');
        const currentLabel = document.getElementById('currentVideoLabel');
        const totalLabel = document.getElementById('totalVideosLabel');
        const counterSpan = document.getElementById('videoCounter');

        // ------------------------------------------------------------
        // 3. Функция обновления интерфейса
        // ------------------------------------------------------------
        function renderButtonsAndCounter() {
            const count = videoList.length;

            // Обновляем счётчик
            counterSpan.textContent = count;
            totalLabel.textContent = `📹 Всего: ${count}`;

            // Если видео нет — показываем заглушку
            if (count === 0) {
                buttonPanel.innerHTML = `<div class="empty-state">📭 Нет видео. Добавьте их в список.</div>`;
                // Очищаем плеер
                playerIframe.src = '';
                currentLabel.textContent = '⏸️ Нет видео';
                return;
            }

            // Генерируем кнопки
            let buttonsHtml = '';
            for (let i = 0; i < count; i++) {
                const video = videoList[i];
                // безопасный title, если вдруг нет
                const title = video.title ? video.title : `Видео ${i+1}`;
                // активный класс для первой кнопки (по умолчанию)
                const activeClass = (i === 0) ? 'active' : '';
                buttonsHtml += `
                    <button class="video-btn ${activeClass}" data-index="${i}">
                        <span>${title}</span>
                        <span class="badge">${i+1}</span>
                    </button>
                `;
            }
            buttonPanel.innerHTML = buttonsHtml;

            // Устанавливаем первое видео в плеер, если есть
            if (count > 0 && videoList[0]) {
                playerIframe.src = videoList[0].src;
                currentLabel.textContent = `▶️ ${videoList[0].title || 'Видео 1'}`;
            }

            // ------------------------------------------------------------
            // 4. Обработка кликов по кнопкам (делегирование)
            // ------------------------------------------------------------
            buttonPanel.querySelectorAll('.video-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const index = parseInt(this.dataset.index, 10);
                    if (isNaN(index) || index < 0 || index >= videoList.length) return;

                    // Меняем src у iframe
                    const video = videoList[index];
                    if (video && video.src) {
                        playerIframe.src = video.src;
                        // обновляем подпись
                        currentLabel.textContent = `▶️ ${video.title || `Видео ${index+1}`}`;
                    }

                    // Убираем активный класс у всех кнопок
                    document.querySelectorAll('.video-btn').forEach(b => b.classList.remove('active'));
                    // Добавляем активный класс текущей кнопке
                    this.classList.add('active');
                });
            });
        }

        // ------------------------------------------------------------
        // 5. Инициализация
        // ------------------------------------------------------------
        renderButtonsAndCounter();

        // ------------------------------------------------------------
        // 6. (Опционально) автоматическое обновление при изменении размера
        //    ничего не делаем, адаптивность уже в css.
        // ------------------------------------------------------------
        // Если нужно перезапустить рендер при изменении списка вручную —
        // можно вызвать renderButtonsAndCounter() из консоли.
        // Для удобства выведим в консоль подсказку:
        console.log('📺 Видео-менеджер загружен. Список видео:', videoList);
        console.log('💡 Чтобы добавить видео, отредактируйте массив videoList в коде.');

        // Дополнительно: если нужно динамически добавить видео без перезагрузки,
        // можно добавить функцию в глобальную область (но это не требуется)
        window.__addVideo = function(src, title) {
            videoList.push({ src, title: title || `Видео ${videoList.length+1}` });
            renderButtonsAndCounter();
        };
        console.log('🔧 Используйте window.__addVideo("src", "title") для добавления видео на лету.');

    })();
</script>

</body>
</html>
